<script>

const setS=(id,x)=>{const e=$(id);if(!e)return;e.value=x;$('o_'+id).textContent=e.value+' '+e.dataset.u};
const hex2=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`};

/* ================= storage, sound, toast, confetti ================= */
let done=new Set();try{done=new Set(JSON.parse(localStorage.getItem('fluxlab-stars')||'[]'))}catch(e){}

function tone(fq,d=.08,type='sine',v=.04,delay=0){if(!sndOn)return;const a=au();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(fq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(1e-4,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}
const chime=()=>[523,659,784,1047,1319].forEach((q,i)=>tone(q,.3,'triangle',.06,i*.07));
const pop=()=>{tone(300,.12,'square',.03);tone(150,.18,'sine',.05,.03)};
$('snd').onclick=()=>{sndOn=!sndOn;$('snd').textContent=sndOn?'🔊':'🔇';try{localStorage.setItem('fluxlab-snd',sndOn?'1':'0')}catch(e){}if(sndOn)tone(660,.1,'triangle',.05)};
$('snd').textContent=sndOn?'🔊':'🔇';
let toastT=0;function toast(t){const e=$('toast');e.innerHTML=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2600)}
const fx=$('fx'),fxc=fx.getContext('2d');let conf=[];
function confetti(n=140){const r=$('stage').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.35,cols=['#ffd54f','#ff5a6a','#4fd1ff','#3ddc97','#b388ff','#ff9f43'];
 for(let i=0;i<n;i++){const a=Math.random()*2*PI,s=4+Math.random()*9;conf.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:Math.random()*PI,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],w:5+Math.random()*6,l:1})}}
function fxFrame(){if(!conf.length&&!fx._on)return;const W=innerWidth,H=innerHeight;if(fx.width!==W||fx.height!==H){fx.width=W;fx.height=H}fxc.clearRect(0,0,W,H);fx._on=conf.length>0;
 conf=conf.filter(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.009;fxc.save();fxc.globalAlpha=Math.max(0,p.l);fxc.translate(p.x,p.y);fxc.rotate(p.r);fxc.fillStyle=p.c;fxc.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);fxc.restore();return p.l>0&&p.y<H+20})}

/* ================= 3D engine on a 2D canvas ================= */
const cv=$('c'),ctx=cv.getContext('2d');let W=300,H=300,DPR=1,DPRMAX=2,QL=1;
const TOUCH=matchMedia('(pointer:coarse)').matches,mob=()=>W<560||H<420;
function resize(){const r=$('stage').getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,DPRMAX);W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
new ResizeObserver(resize).observe($('stage'));resize();
const cam={az:.85,el:.38,dist:13,fov:45};let eye,fw,rt,upv,foc;

const glowC={};
function sprite(col){if(glowC[col])return glowC[col];const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.15,col);gr.addColorStop(.45,hex2(col,.35));gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return glowC[col]=c}
function glow(sp,r,col,a=1){if(!sp)return;ctx.globalAlpha=clamp(a,0,1);ctx.drawImage(sprite(col),sp[0]-r,sp[1]-r,2*r,2*r);ctx.globalAlpha=1}
function line3(a,b,col,w=1,al=1){const p=P(a),q=P(b);if(!p||!q)return;ctx.globalAlpha=al;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();ctx.globalAlpha=1}

function chHTML(m){const n=CH[m].filter(c=>done.has(c.id)).length;return`<div class="card ch"><h3><span>🎯 Challenges</span><span style="color:var(--gold)">${n}/${CH[m].length} ★</span></h3>${CH[m].map(c=>`<div class="ci ${done.has(c.id)?'done':''}" id="ci_${c.id}"><span class="st">${done.has(c.id)?'★':'☆'}</span><div><b>${c.t}</b><small>${c.d}</small></div></div>`).join('')}</div>`}

/* =====================================================================
   MODE 1 — FLUX CATCHER
   ===================================================================== */
const M1={E:200,A:4,th:35,parts:[],bursts:[],rate:0,spin:false,dragged:false,lastTick:0,drag:false};
CH[0]=[
 {id:'m1max',t:'Full catch',d:'Get the biggest possible positive flux for your sheet.',ok:()=>Math.cos(M1.th*PI/180)>.9995},
 {id:'m1zero',t:'Ghost sheet',d:'Make the flux zero while the sheet sits right in the field.',ok:()=>Math.abs(Math.cos(M1.th*PI/180))<.009},
 {id:'m1half',t:'Half power',d:'Catch exactly half of the maximum flux for your sheet.',ok:()=>Math.abs(Math.cos(M1.th*PI/180)-.5)<.009},
 {id:'m1neg',t:'Backwards',d:'Make the flux negative: sparks go through against the normal.',ok:()=>Math.cos(M1.th*PI/180)<-.25},
 {id:'m1tgt',t:'Bullseye',d:'Hit Φ = 450 N·m²/C (±2%). You’ll need more than one slider.',ok:()=>Math.abs(m1Phi()-450)<=9}];
const m1Phi=()=>M1.E*M1.A*Math.cos(M1.th*PI/180);
const m1Panel=()=>`<h2>Flux Catcher</h2><p class="intro">The blue sparks are a uniform <b>electric field</b>. Your green sheet is a surface. <b>Flux is how much field flies through it.</b> Drag the <span style="color:var(--A)">pink handle</span> to tilt the sheet.</p>
<div class="card"><div class="eq" id="m1eq"></div><div class="legend" style="margin-top:8px"><span><i class="k" style="background:var(--E)"></i>field <span class="vec">E</span></span><span><i class="k" style="background:var(--sf)"></i>sheet, area A</span><span><i class="k" style="background:var(--A)"></i>normal <span class="vec">n̂</span></span><span><i class="k" style="background:var(--gold)"></i>shadow = A cos θ</span></div></div>
${sl('E','Field strength E: more sparks',50,500,10,M1.E,'N/C')}${sl('A','Sheet area A',1,9,.5,M1.A,'m²')}${sl('th','Tilt θ: angle from E to the normal',0,180,1,Math.abs(M1.th),'°')}
<div class="row"><span class="t">Try:</span><button onclick="m1Set(0)">θ = 0°</button><button onclick="m1Set(60)">60°</button><button onclick="m1Set(90)">90°</button><button onclick="m1Set(180)">180°</button><button id="m1spin" onclick="M1.spin=!M1.spin;this.classList.toggle('on',M1.spin)">⟳ Spin</button></div>
<div class="row"><span class="t">Lecture (E = 100 N/C, A = 4 m²):</span><button onclick="m1Lec(0)">Ex. 1 · 0°</button><button onclick="m1Lec(90)">Ex. 2 · 90°</button><button onclick="m1Lec(70)">Ex. 3 · 70°</button></div>
${chHTML(0)}
<details><summary>Key ideas</summary>
<p><b>Flux counts what gets through.</b> Every spark moves at the same speed, so the rate at which the sheet catches sparks is proportional to Φ<sub>E</sub> = EA cos θ.</p>
<p><b>θ is measured from the normal.</b> At θ = 0° the sheet faces the field head-on. At θ = 90° it is edge-on and nothing gets through. The angle to the sheet itself is |90° − θ|.</p>
<p><b>The shadow.</b> The gold outline is the sheet’s shadow seen along the field. Its area is A cos θ: the area the field actually “sees”.</p>
<p><b>Sign.</b> Sparks crossing along <span class="vec">n̂</span> count as positive (orange). Sparks crossing against it count as negative (purple). For a closed surface <span class="vec">n̂</span> points outward.</p></details>`;
function m1Set(d){M1.th=d;M1.spin=false;const b=$('m1spin');if(b)b.classList.remove('on');setS('th',d)}
function m1Lec(d){M1.E=100;M1.A=4;setS('E',100);setS('A',4);m1Set(d)}
function m1Spawn(p,any){p.x=any?-6+Math.random()*12:-6-Math.random()*.6;p.y=(Math.random()*2-1)*2.3;p.z=(Math.random()*2-1)*2.3;p.hit=0;p.hc=0;return p}
function m1Pick(sx,sy){const th=M1.th*PI/180,tip=P([1.9*Math.cos(th),0,1.9*Math.sin(th)]);if(tip&&Math.hypot(sx-tip[0],sy-tip[1])<(TOUCH?48:32)){M1.drag=true;tone(520,.06,'triangle',.04);
 return{move(x,y){const h=hitY(x,y,0);if(!h)return;let a=Math.round(Math.atan2(h[2],h[0])*180/PI);M1.th=a;M1.spin=false;M1.dragged=true;const b=$('m1spin');if(b)b.classList.remove('on');setS('th',Math.abs(a))},up(){M1.drag=false}}}return null}
function m1Hover(sx,sy){const th=M1.th*PI/180,tip=P([1.9*Math.cos(th),0,1.9*Math.sin(th)]);return tip&&Math.hypot(sx-tip[0],sy-tip[1])<(TOUCH?48:32)}
function m1Frame(dt,t){
 const N=Math.round(M1.E*1.3*QL);while(M1.parts.length<N)M1.parts.push(m1Spawn({},true));if(M1.parts.length>N)M1.parts.length=N;
 if(M1.spin){M1.th+=45*dt;if(M1.th>180)M1.th-=360;setS('th',Math.round(Math.abs(M1.th)))}
 const th=M1.th*PI/180,c=Math.cos(th),sn=Math.sin(th),n=[c,0,sn],tg=[-sn,0,c],h=Math.sqrt(M1.A)/2,v=2.8;let got=0;
 for(const p of M1.parts){const x0=p.x;p.x+=v*dt;p.hit=Math.max(0,p.hit-dt);const s0=c*x0+sn*p.z,s1=c*p.x+sn*p.z;
  if((s0<0)!==(s1<0)){const fr=s0/(s0-s1),cx=x0+(p.x-x0)*fr,u=-sn*cx+c*p.z;if(Math.abs(u)<=h&&Math.abs(p.y)<=h){p.hit=.7;p.hc=c>0?1:-1;got++;if(M1.bursts.length<220)M1.bursts.push({p:[cx,p.y,p.z],t:0,s:p.hc})}}
  if(p.x>6)m1Spawn(p)}
 M1.rate=M1.rate*Math.exp(-dt)+got;
 if(got&&t-M1.lastTick>.07){M1.lastTick=t;tone(c>0?880+Math.random()*120:330+Math.random()*60,.05,'sine',.012)}
 M1.bursts=M1.bursts.filter(b=>(b.t+=dt)<.5);
 /* ---- draw ---- */
 floor();
 const corners=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>add3(scl(tg,a*h),[0,b*h,0]));
 /* shadow on the back wall */
 const shX=-5.6;poly3(corners.map(q=>[shX,q[1],q[2]]),hex2('#ffd54f',.06+.06*Math.abs(c)),'rgba(255,213,79,.75)',1.5,[6,5]);
 if(Math.abs(c)>.05)label([shX,h+.35,0],'shadow = A cos θ','#ffd54f',12);
 corners.forEach(q=>line3(q,[shX,q[1],q[2]],'rgba(255,213,79,.12)',1));
 if(!mob())label([-3.4,-2.7,-2.3],'Electric field  E  →','#4fd1ff',14);
 const camSide=Math.sign(dot(n,eye))||1;
 const drawParts=side=>{lighter(true);for(const p of M1.parts){if((Math.sign(c*p.x+sn*p.z)||1)!==side)continue;const a=P([p.x-.45,p.y,p.z]),b=P([p.x,p.y,p.z]);if(!a||!b)continue;
   const col=p.hit>0?(p.hc>0?'#ffad2e':'#b388ff'):'#4fd1ff',al=p.hit>0?.9:.45;ctx.globalAlpha=al;ctx.strokeStyle=col;ctx.lineWidth=clamp(b[3]*.045,1,2.6);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
   glow(b,p.hit>0?clamp(b[3]*.32,6,14):clamp(b[3]*.17,3,8),col,p.hit>0?1:.7)}ctx.globalAlpha=1;lighter(false)};
 drawParts(-camSide);
 /* the sheet */
 const boost=Math.min(.25,M1.rate/400),cf=c>=0?'#3ddc97':'#b388ff';
 poly3(corners,hex2(cf,.1+.12*Math.abs(c)+boost),cf,2.2);
 for(let k=1;k<4;k++){const a=-h+k*h/2;line3(add3(scl(tg,a),[0,-h,0]),add3(scl(tg,a),[0,h,0]),hex2(cf,.25),1);line3(add3(scl(tg,-h),[0,a,0]),add3(scl(tg,h),[0,a,0]),hex2(cf,.25),1)}
 drawParts(camSide);
 lighter(true);for(const b of M1.bursts){const q=P(b.p);if(q)glow(q,clamp(q[3]*(.15+b.t*1.1),5,40),b.s>0?'#ffad2e':'#b388ff',1-b.t/.5)}lighter(false);
 /* θ arc, E ref, normal + handle */
 const arc=[];for(let i=0;i<=40;i++){const a=th*i/40;arc.push(P([1.05*Math.cos(a),0,1.05*Math.sin(a)]))}
 if(arc.every(Boolean)){ctx.strokeStyle='#ffd54f';ctx.lineWidth=2;ctx.beginPath();arc.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}
 arrow([0,0,0],[1,0,0],2.1,'#ffffff',2.5,.9);label([2.4,.05,0],'E','#ffffff',14);
 if(Math.abs(M1.th)>5)label([1.35*Math.cos(th/2),.15,1.35*Math.sin(th/2)],`θ = ${Math.round(Math.abs(M1.th))}°`,'#ffd54f',12);
 const tip=arrow([0,0,0],n,1.9,'#ff5c9a',3);
 if(tip){const pul=.5+.5*Math.sin(t*5);lighter(true);glow(tip,15+(M1.drag?8:pul*5),'#ff5c9a',.9);lighter(false);ctx.strokeStyle='#ffd1e2';ctx.lineWidth=2;ctx.beginPath();ctx.arc(tip[0],tip[1],10+(M1.dragged?0:pul*4),0,2*PI);ctx.stroke();
  if(!M1.dragged){ctx.font='700 12px system-ui';ctx.fillStyle='#ffd1e2';ctx.textAlign='center';ctx.fillText('drag me',tip[0],tip[1]+26)}}
 label(scl(n,2.45),'n̂','#ff5c9a',15);
}
function m1HUD(){const F=m1Phi(),c=Math.cos(M1.th*PI/180),col=F<-.5?'#b388ff':F>.5?'#ffad2e':'#cfd8e6';
 const bar=`<div class="hb" style="position:relative"><i style="position:absolute;left:${50+Math.min(0,50*c)}%;width:${Math.abs(50*c)}%;background:${c>=0?'#ffad2e':'#b388ff'}"></i><b style="position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#8d9bb3"></b></div>`;
 if(mob())$('hud').innerHTML=`<div class="big" style="color:${col}">Φ = ${f(F,1)} <span style="font-size:11px">N·m²/C</span></div>${bar}<div style="color:var(--mu)">${Math.round(Math.abs(c)*100)}% of max · θ = ${Math.round(Math.abs(M1.th))}°</div>`;
 else $('hud').innerHTML=`<div class="lbl">Electric flux Φ<sub>E</sub></div><div class="big" style="color:${col}">${f(F,1)} <span style="font-size:13px">N·m²/C</span></div>
 <div class="hb" style="position:relative"><i style="position:absolute;left:${50+Math.min(0,50*c)}%;width:${Math.abs(50*c)}%;background:${c>=0?'#ffad2e':'#b388ff'}"></i><b style="position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#8d9bb3"></b></div>
 <div style="color:var(--mu)">${Math.round(M1.rate)} sparks / s caught · ${Math.round(Math.abs(c)*100)}% of max</div>`;
 const e=$('m1eq');if(e)e.innerHTML=`Φ<sub>E</sub> = E A cos θ = (${M1.E})(${M1.A}) cos ${Math.round(Math.abs(M1.th))}° = <span style="color:${col}">${f(F,1)}</span> N·m²/C`}
function m1Input(t){if(t.id=='E')M1.E=+t.value;if(t.id=='A')M1.A=+t.value;if(t.id=='th'){M1.th=+t.value;M1.spin=false;const b=$('m1spin');if(b)b.classList.remove('on')}}

/* =====================================================================
   MODE 2 — GAUSS ARENA
   ===================================================================== */
const M2={cx:0,cz:0,ch:[{q:2,x:0,z:0}],shape:'sph',R:2.3,lines:[],cross:[],dirty:true,flux:{o:0,i:0},t:0,show:{l:1,f:1,s:1},drag:null,poofs:[],fr:0,lastQ:null};
CH[1]=[
 {id:'m2enc',t:'Trap +3',d:'Enclose a net charge of exactly +3 μC.',ok:()=>Math.abs(m2Qenc()-3)<1e-9},
 {id:'m2zero',t:'Perfect balance',d:'Zero net flux with at least two charges inside.',ok:()=>m2Inside().length>=2&&Math.abs(m2Qenc())<1e-9},
 {id:'m2out',t:'Gatecrasher',d:'Park a charge just outside the surface (within 0.5 m). Watch the net flux not care.',ok:()=>M2.ch.some(h=>{const d=m2sd([h.x,0,h.z]);return d>0&&d<.5})},
 {id:'m2jelly',t:'Jelly test',d:'Switch to the wobbly blob with charge inside. The surface wobbles; the flux doesn’t.',ok:()=>M2.shape=='blob'&&Math.abs(m2Qenc())>1e-9},
 {id:'m2ex11',t:'Example 11 · S3',d:'Enclose all three charges of Example 11 (−2Q, +Q, −Q) for Φ = −2Q/ε₀.',ok:()=>Math.abs(m2Qenc()+2)<1e-9&&m2Inside().length>=3},
 {id:'m2sink',t:'Black hole',d:'Make the net flux point inward (negative Φ).',ok:()=>m2Qenc()<-1e-9}];
const cubeA=()=>M2.R*.82;
function m2rho(th,ph){if(M2.shape!='blob')return M2.R;const t=M2.t;return M2.R*(1+.17*Math.sin(3*th+1.3*t)*Math.cos(2*ph-.9*t)+.09*Math.sin(5*ph+2*th+1.7*t))}
const m2P=(th,ph)=>{const v=scl(dirTP(th,ph),m2rho(th,ph));v[0]+=M2.cx;v[2]+=M2.cz;return v};
function m2sd(p){p=[p[0]-M2.cx,p[1],p[2]-M2.cz];if(M2.shape=='cube')return Math.max(Math.abs(p[0]),Math.abs(p[1]),Math.abs(p[2]))-cubeA();const r=len(p);if(r<1e-9)return-1;return r-m2rho(Math.acos(clamp(p[1]/r,-1,1)),Math.atan2(p[2],p[0]))}
const m2Inside=()=>M2.ch.filter(h=>m2sd([h.x,0,h.z])<0);
const m2Qenc=()=>m2Inside().reduce((s,h)=>s+h.q,0);
function Ef(p){let a=0,b=0,c=0;for(const h of M2.ch){const dx=p[0]-h.x,dy=p[1],dz=p[2]-h.z,d2=dx*dx+dy*dy+dz*dz+1e-9,m=K*h.q*1e-6/(d2*Math.sqrt(d2));a+=m*dx;b+=m*dy;c+=m*dz}return[a,b,c]}
function m2Flux(){let o=0,ii=0;const add=x=>{x>0?o+=x:ii+=x};
 if(M2.shape=='cube'){const a=cubeA(),N=40,st=2*a/N,dd=st*st,p=[0,0,0];for(let ax=0;ax<3;ax++)for(const sg of[1,-1])for(let i=0;i<N;i++)for(let j=0;j<N;j++){p[ax]=sg*a;p[(ax+1)%3]=-a+(i+.5)*st;p[(ax+2)%3]=-a+(j+.5)*st;add(sg*Ef([p[0]+M2.cx,p[1],p[2]+M2.cz])[ax]*dd)}}
 else{const Nt=M2.shape=='blob'?Math.round(44*Math.sqrt(QL)):44,Np=2*Nt,dt=PI/Nt,dp=2*PI/Np,hh=1e-3;for(let i=0;i<Nt;i++)for(let j=0;j<Np;j++){const th=(i+.5)*dt,ph=(j+.5)*dp,P0=m2P(th,ph);let n;
   if(M2.shape=='sph'){n=scl(dirTP(th,ph),M2.R*M2.R*Math.sin(th))}else{const Pt=scl(sub3(m2P(th+hh,ph),m2P(th-hh,ph)),.5/hh),Pf=scl(sub3(m2P(th,ph+hh),m2P(th,ph-hh)),.5/hh);n=cross(Pt,Pf);if(dot(n,sub3(P0,[M2.cx,0,M2.cz]))<0)n=scl(n,-1)}
   add(dot(Ef(P0),n)*dt*dp)}}
 M2.flux={o,i:ii}}
function m2Lines(){const L=[];for(const h of M2.ch){const N=Math.round(6*Math.abs(h.q)),sg=Math.sign(h.q);for(let k=0;k<N;k++){const d=fib(N,k);let p=[h.x+d[0]*.2,d[1]*.2,h.z+d[2]*.2];const pts=[p];let opp=false;
  for(let s=0;s<280;s++){const e=Ef(p),m=len(e);if(m<1e-3)break;const mid=add3(p,scl(e,sg*.035/m)),e2=Ef(mid),m2=len(e2);p=add3(p,scl(e2,sg*.07/m2));pts.push(p);if(len(p)>9.5)break;
   if(M2.ch.some(o=>o.q*h.q<0&&Math.hypot(p[0]-o.x,p[1],p[2]-o.z)<.2)){opp=true;break}}
  if(h.q<0&&opp)continue;L.push({pts:sg>0?pts:pts.slice().reverse(),ph:Math.random()})}}M2.lines=L}
function m2Cross(){const C=[];for(const L of M2.lines){let prev=m2sd(L.pts[0]);for(let i=1;i<L.pts.length;i++){const s=m2sd(L.pts[i]);if((prev<0)!==(s<0)){const fr=prev/(prev-s);C.push({p:add3(L.pts[i-1],scl(sub3(L.pts[i],L.pts[i-1]),fr)),out:s>prev})}prev=s}}M2.cross=C}
function m2Add(q){if(M2.ch.length>=7){toast('Arena full: drag a charge off the edge to remove it');return}const a=Math.random()*2*PI,r=.6+Math.random()*2.6;M2.ch.push({q,x:+(r*Math.cos(a)).toFixed(2),z:+(r*Math.sin(a)).toFixed(2),born:performance.now()});M2.dirty=true;tone(q>0?700:400,.12,'triangle',.05)}
function m2ShapeUI(){document.querySelectorAll('[data-sh]').forEach(b=>b.classList.toggle('on',b.dataset.sh==M2.shape))}
function m2Ex11(k){M2.ch=[{q:-2,x:0,z:-1.6},{q:1,x:0,z:0},{q:-1,x:0,z:1.6}];M2.shape='sph';const S=[[0,-.8,1.4],[0,.8,1.4],[0,0,2.4],[2.7,0,1.1]][k];M2.cx=S[0];M2.cz=S[1];M2.R=S[2];setS('R',M2.R);m2ShapeUI();
 document.querySelectorAll('[data-s11]').forEach(b=>b.classList.toggle('on',+b.dataset.s11==k));M2.dirty=true;tone(500+k*90,.1,'triangle',.05);toast(`Example 11 · S${k+1}: Φ = ${['−Q/ε₀','0','−2Q/ε₀','0'][k]}`)}
function m2Ex12(k){if(k==0||!M2.ch.length){M2.ch=[{q:1,x:0,z:0}];M2.cx=M2.cz=0;M2.R=2;M2.shape='sph'}if(k==1)M2.ch[0].q=3;if(k==2)M2.R=Math.min(4.5,M2.R*2);if(k==3)M2.shape='cube';if(k==4){M2.ch[0].x=1.1;M2.ch[0].z=.7}
 setS('R',M2.R);m2ShapeUI();document.querySelectorAll('[data-s11]').forEach(b=>b.classList.remove('on'));M2.dirty=true;tone(500+k*90,.1,'triangle',.05);
 toast(['Example 12: q at the centre','(A) Charge tripled → flux tripled','(B) Radius doubled → flux unchanged','(C) Cube → flux unchanged','(D) Charge moved → flux unchanged'][k])}
function m2Shape(s){M2.shape=s;M2.dirty=true;document.querySelectorAll('[data-sh]').forEach(b=>b.classList.toggle('on',b.dataset.sh==s));tone(500,.08,'triangle',.04)}
function m2Preset(k){M2.cx=M2.cz=0;document.querySelectorAll('[data-s11]').forEach(b=>b.classList.remove('on'));M2.ch=k==0?[{q:2,x:0,z:0}]:k==1?[{q:1,x:-.8,z:.3},{q:2,x:4,z:-.5}]:k==2?[{q:2,x:-.9,z:0},{q:-2,x:.9,z:0}]:[{q:1,x:1.2,z:.8},{q:1,x:-1,z:-.6},{q:-1,x:.2,z:-1.4},{q:-2,x:3.6,z:1.5}];M2.dirty=true;pop()}
const m2Panel=()=>`<h2>Gauss Arena</h2><p class="intro"><b>Drag charges around</b> and watch the field flow. The glassy shape is your <b>Gaussian surface</b>. Orange flashes are field leaving it, cyan flashes are field entering. Drag a charge off the edge to delete it.</p>
<div class="card"><div class="eq">∮ <span class="vec">E</span> · d<span class="vec">A</span> = Q<sub>enc</sub> / ε₀</div><div style="color:var(--mu);font-size:12.5px;margin-top:4px">Net flux out of <i>any</i> closed surface depends only on the charge inside it.</div></div>
<div class="row"><span class="t">Add:</span><button class="chg p" onclick="m2Add(1)">+1 μC</button><button class="chg p" onclick="m2Add(2)">+2 μC</button><button class="chg n" onclick="m2Add(-1)">−1 μC</button><button class="chg n" onclick="m2Add(-2)">−2 μC</button><button onclick="M2.ch=[];M2.dirty=true;pop()">Clear</button></div>

<details><summary>Key ideas</summary>
<p><b>Field vs. flux.</b> <span class="vec">E</span> is a vector at every point. Φ is one number for the whole closed surface: field out minus field in.</p>
<p><b>Outside charges add zero.</b> Their field lines go in one side and out the other, so every cyan flash has a matching orange one.</p>
<p><b>Shape doesn’t matter.</b> Sphere, cube or wobbling jelly: the net flux stays Q<sub>enc</sub>/ε₀. The surface colour shows <span class="vec">E</span>·d<span class="vec">A</span> varies wildly on a cube or blob; only the total is fixed.</p>
<p><b>How it’s computed.</b> The flux is a real numerical integral of <span class="vec">E</span>·d<span class="vec">A</span> over the surface (thousands of patches), so the ✓ is a genuine check of Gauss’s law. It gets less accurate when a charge sits almost on the surface. Field lines (6 per μC) are drawn for illustration.</p></details>`;

<p><b>The surface is your choice.</b> It doesn’t have to be a real surface. Pick one through P on which <span class="vec">E</span> is either parallel to d<span class="vec">A</span> with constant size, or perpendicular to it.</p>
